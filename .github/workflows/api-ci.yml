name: TECHNOVA API CI

on:
  push:
    branches: ["mobile/technova-native"]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    branches: ["mobile/technova-native"]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"
  workflow_dispatch:

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
