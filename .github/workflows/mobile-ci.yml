name: TECHNOVA Mobile CI

on:
  push:
    branches: ["mobile/technova-native"]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: ["mobile/technova-native"]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "platform-tools"
      - run: npm install
      - run: npx expo install --check
      - run: npx expo-doctor
      - run: npx tsc --noEmit
      - run: npx expo export --platform android
      - run: npx expo prebuild --platform android --no-install
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: technova-android-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
